<mat-sidenav-container *ngIf="showLayout">

  <mat-sidenav mode="side" [opened]="isSidebarOpen">
    
    <app-sidebar></app-sidebar> 

  </mat-sidenav>

  <mat-sidenav-content>
    
    <app-navbar (menuToggle)="toggleSidebar()"></app-navbar>

    <div class="main-content-area">
      <router-outlet></router-outlet>
    </div>

  </mat-sidenav-content>

</mat-sidenav-container>

<router-outlet *ngIf="!showLayout"></router-outlet>
