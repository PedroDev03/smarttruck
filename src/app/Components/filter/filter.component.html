<form [formGroup]="form" class="filter-container">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Pesquisar</mat-label>
    <input matInput placeholder="Título, descrição ou cliente" formControlName="search">
    <button mat-icon-button matSuffix *ngIf="form.value.search" (click)="form.patchValue({ search: '' })">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <mat-form-field appearance="outline" class="filter-field status-field">
    <mat-label>Status</mat-label>
    <mat-select formControlName="status">
      <mat-option value="all">Todos</mat-option>
      <mat-option value="open">Aberto</mat-option>
      <mat-option value="closed">Fechado</mat-option>
      <mat-option value="in_progress">Em andamento</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button type="button" (click)="clear()">Limpar</button>
</form>
