<!-- 1. O card branco que fica no meio da área azul -->
<div class="page-container">
  <!-- 2. O cabeçalho (igual ao da tela de chamados) -->
  <header class="page-header">
    <h2>Criar Novo Cliente</h2>
  </header>

  <!-- 
    [formGroup]="userForm"  <-- Conecta o <form> ao "Estado" (o seu useState)
    (ngSubmit)="onSubmit()" <-- Chama o "handleSubmit"
  -->
  <form [formGroup]="clientForm" (ngSubmit)="onSubmit()" class="client-form">
    <!-- CAMPO NOME -->
    <mat-form-field appearance="outline">
      <mat-label>Nome Completo</mat-label>
      <input matInput formControlName="nome" />
      <mat-error
        *ngIf="
          clientForm.get('nome')?.touched && clientForm.get('nome')?.invalid
        "
      >
        Nome é obrigatório (mín. 3 letras).
      </mat-error>
    </mat-form-field>

    <!-- CAMPO EMAIL -->
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        formControlName="email"
        placeholder="Ex: joao@smarttruck.com"
      />
      <mat-error
        *ngIf="
          clientForm.get('email')?.touched && clientForm.get('email')?.invalid
        "
      >
        Email inválido.
      </mat-error>
    </mat-form-field>

    <!-- CAMPO TELEFONE -->
    <mat-form-field appearance="outline">
      <mat-label>Telefone</mat-label>
      <input
        matInput
        formControlName="phone"
        placeholder="Ex: (62) 99999-9999"
      />
      <mat-error
        *ngIf="
          clientForm.get('phone')?.touched && clientForm.get('phone')?.invalid
        "
      >
        Telefone é obrigatório.
      </mat-error>
    </mat-form-field>

    <!-- BOTÃO SUBMIT -->
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="clientForm.invalid"
      class="submit-button"
    >
      Salvar Usuário
    </button>
  </form>
</div>
